<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HROne Deck</title>
<link rel="icon" type="image/svg+xml" href="Assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#013a29;font-family:'Public Sans',system-ui,sans-serif;}
.deck{display:flex;width:100vw;height:100vh;overflow:hidden;}

/* ═══════════════════════════════
   SIDEBAR
═══════════════════════════════ */
.sidebar{
  flex-shrink:0;
  width:264px;
  height:100vh;
  background:#0d1f14;
  display:flex;
  flex-direction:column;
  transition:width .3s cubic-bezier(.4,0,.2,1);
  border-right:1px solid rgba(255,255,255,.06);
  z-index:10;
  overflow:hidden;
}
.sidebar.collapsed{ width:60px; }

/* ── Header ──────────────────── */
.nav-hdr{
  flex-shrink:0;
  height:60px;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:10px;
  border-bottom:1px solid rgba(255,255,255,.07);
  overflow:hidden;
}
.hdr-logo{
  width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.hdr-logo svg{ width:100%;height:100%; }
.hdr-title{
  flex:1;
  font-size:14px;font-weight:700;color:#fff;
  white-space:nowrap;overflow:hidden;
  transition:opacity .18s;
}
.hdr-toggle{
  flex-shrink:0;
  width:30px;height:30px;
  border-radius:8px;border:none;
  background:rgba(255,255,255,.08);
  color:rgba(255,255,255,.55);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
.hdr-toggle:hover{background:rgba(255,255,255,.14);color:#fff;}
.hdr-toggle svg{
  width:15px;height:15px;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
/* When expanded, chevron points left (collapse) */
.sidebar:not(.collapsed) .hdr-toggle svg{ transform:rotate(180deg); }

/* Collapsed header — only toggle, centered */
.sidebar.collapsed .nav-hdr{ padding:0; justify-content:center; }
.sidebar.collapsed .hdr-logo,
.sidebar.collapsed .hdr-title{ display:none; }
.sidebar.collapsed .hdr-toggle{ width:34px;height:34px; }

/* ── Search ──────────────────── */
.nav-srch{
  flex-shrink:0;
  overflow:hidden;
  max-height:58px;
  padding:10px 12px;
  border-bottom:1px solid rgba(255,255,255,.06);
  transition:max-height .28s ease, padding .28s ease, opacity .18s;
}
.sidebar.collapsed .nav-srch{
  max-height:0; padding-top:0; padding-bottom:0;
  opacity:0; pointer-events:none;
}
.srch-inner{ position:relative; }
.srch-icon{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:rgba(255,255,255,.3);pointer-events:none;line-height:0;
}
.srch-icon svg{ width:14px;height:14px; }
.nav-srch input{
  width:100%;height:36px;
  border-radius:9px;
  background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.08);
  color:#fff;font-family:inherit;font-size:13px;
  padding:0 10px 0 34px;
  outline:none;
  transition:border-color .15s,background .15s;
}
.nav-srch input::placeholder{ color:rgba(255,255,255,.28); }
.nav-srch input:focus{
  border-color:rgba(35,165,120,.5);
  background:rgba(35,165,120,.05);
}

/* ── Scroll area ─────────────── */
.nav-scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:8px 0 20px;
  transition:opacity .18s;
}
.nav-scroll::-webkit-scrollbar{ width:3px; }
.nav-scroll::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.1);border-radius:2px; }
.nav-scroll::-webkit-scrollbar-track{ background:transparent; }

/* Collapsed: fully hidden scroll content */
.sidebar.collapsed .nav-scroll{ opacity:0; pointer-events:none; overflow:hidden; }

/* ── Group ───────────────────── */
.nav-grp{ margin:0 8px 2px; }

.grp-hdr{
  display:flex;align-items:center;gap:9px;
  height:42px;padding:0 10px;
  border-radius:9px;
  cursor:pointer;user-select:none;
  transition:background .12s;
}
.grp-hdr:hover{ background:rgba(255,255,255,.06); }
.nav-grp.open > .grp-hdr{ background:rgba(255,255,255,.05); }

.grp-icon{
  width:20px;height:20px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.38);
  transition:color .15s;
}
.grp-icon svg{ width:14px;height:14px; }
.nav-grp.open .grp-icon,
.grp-hdr:hover .grp-icon{ color:rgba(255,255,255,.65); }

.grp-label{
  flex:1;
  font-size:13px;font-weight:600;letter-spacing:.01em;
  color:rgba(255,255,255,.6);
  white-space:nowrap;overflow:hidden;
  transition:color .15s;
}
.nav-grp.open .grp-label,
.grp-hdr:hover .grp-label{ color:rgba(255,255,255,.88); }

.grp-badge{
  flex-shrink:0;
  font-size:10.5px;font-weight:700;
  color:rgba(255,255,255,.28);
  background:rgba(255,255,255,.07);
  border-radius:20px;padding:2px 7px;
  letter-spacing:.02em;
}

.grp-chevron{
  flex-shrink:0;
  width:14px;height:14px;
  color:rgba(255,255,255,.22);
  transition:transform .22s, color .15s;
}
.nav-grp.open .grp-chevron{ transform:rotate(90deg); color:rgba(255,255,255,.4); }
.grp-hdr:hover .grp-chevron{ color:rgba(255,255,255,.35); }

/* ── Slide rows ──────────────── */
.grp-slides{
  overflow:hidden;
  max-height:0;
  transition:max-height .24s ease;
  padding:2px 0 4px;
}
.nav-grp.open .grp-slides{ max-height:600px; }

.slide-row{
  display:flex;align-items:center;gap:9px;
  height:36px;
  padding:0 10px 0 40px;
  border-radius:7px;
  cursor:pointer;
  position:relative;
  transition:background .1s;
}
.slide-row:hover:not(.stub){ background:rgba(255,255,255,.05); }

.slide-row.active{ background:rgba(35,165,120,.13); }
.slide-row.active::before{
  content:'';position:absolute;
  left:0;top:9px;bottom:9px;
  width:3px;background:#23A578;
  border-radius:0 3px 3px 0;
}

.slide-row.stub{ opacity:.3; cursor:default; }
.slide-row.row-disabled{ opacity:.4; }
.slide-row.row-disabled .slide-name{ text-decoration:line-through; text-decoration-color:rgba(255,255,255,.3); }

.slide-eye{
  flex-shrink:0;width:24px;height:24px;border-radius:6px;border:none;
  background:transparent;color:rgba(255,255,255,.32);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,color .15s;
}
.slide-eye:hover{ background:rgba(255,255,255,.1); color:rgba(255,255,255,.85); }
.slide-eye svg{ width:15px;height:15px; }
.slide-row.row-disabled .slide-eye{ color:#e2735a; }

/* light/dark switch on slides that have themes */
.theme-switch{
  flex-shrink:0;position:relative;width:38px;height:20px;border-radius:10px;border:none;cursor:pointer;padding:0;
  background:rgba(255,255,255,.14);transition:background .2s;
}
.theme-switch:hover{ background:rgba(255,255,255,.22); }
.theme-switch .ts-knob{
  position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fdf5e7;color:#c98a1b;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s ease,background .2s,color .2s;
}
.theme-switch .ts-knob svg{ width:10px;height:10px; }
.theme-switch[data-mode="dark"]{ background:rgba(35,165,120,.45); }
.theme-switch[data-mode="dark"] .ts-knob{ transform:translateX(18px);background:#013A29;color:#a0f0c8; }

.slide-num{
  font-size:11px;font-weight:700;
  color:rgba(255,255,255,.22);
  min-width:18px;text-align:right;flex-shrink:0;
  font-variant-numeric:tabular-nums;
  letter-spacing:.03em;
}
.slide-row.active .slide-num{ color:#23A578; }

.slide-name{
  flex:1;
  font-size:13px;font-weight:400;
  color:rgba(255,255,255,.58);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.slide-row.active .slide-name{ color:#fff;font-weight:500; }
.slide-row:hover:not(.stub) .slide-name{ color:rgba(255,255,255,.82); }
.sub-row{
  display:flex;align-items:center;gap:9px;position:relative;cursor:pointer;
  padding:6px 14px 6px 72px;margin:1px 0;border-radius:7px;transition:background .15s;
}
.sub-row::before{ content:'';position:absolute;left:52px;top:2px;bottom:2px;width:1px;background:rgba(255,255,255,.13); }
.sub-row:hover{ background:rgba(255,255,255,.05); }
.sub-row.active{ background:rgba(242,217,140,.12); }
.sub-row.active::before{ background:#F2D98C;width:2px; }
.sub-dot{ width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.3);flex-shrink:0; }
.sub-row.active .sub-dot{ background:#F2D98C; }
.sub-name{ flex:1;font-size:12px;color:rgba(255,255,255,.5);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.sub-row.active .sub-name{ color:#F2D98C;font-weight:500; }
.sub-wrap{ overflow:hidden; max-height:0; transition:max-height .24s ease; }
.sub-wrap.open{ max-height:280px; }
.sub-toggle{
  flex-shrink:0;width:22px;height:22px;border-radius:6px;border:none;
  background:transparent;color:rgba(242,217,140,.7);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,color .15s,transform .2s;
}
.sub-toggle:hover{ background:rgba(242,217,140,.16); color:#F2D98C; }
.sub-toggle.open{ transform:rotate(90deg); }
.sub-toggle svg{ width:11px;height:11px; }
.slide-row.has-sub.active .sub-toggle{ color:#F2D98C; }

/* ── Empty state ─────────────── */
.nav-empty{
  display:none;
  padding:36px 16px;text-align:center;
  font-size:13px;color:rgba(255,255,255,.18);line-height:1.7;
}

/* ── Footer ──────────────────── */
.nav-ftr{
  flex-shrink:0;
  height:58px;
  border-top:1px solid rgba(255,255,255,.07);
  padding:0 12px;
  display:flex;align-items:center;gap:10px;
  overflow:hidden;
}
.sidebar.collapsed .nav-ftr{ padding:0;justify-content:center; }

.btn-present{
  flex:1;height:36px;border-radius:9px;
  background:#23A578;border:none;color:#fff;
  font-family:inherit;font-size:13px;font-weight:600;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;
  overflow:hidden;white-space:nowrap;
  box-shadow:0 2px 12px rgba(35,165,120,.22);
  transition:background .15s,box-shadow .15s;
}
.btn-present:hover{
  background:#1c9c6e;
  box-shadow:0 4px 16px rgba(35,165,120,.32);
}
.btn-present svg{ width:10px;height:10px;flex-shrink:0; }
/* Nudge: a soft ring breathes out and a sheen sweeps across every few seconds,
   until the deck has been presented once this session. */
.btn-present{ position:relative; }
.btn-present.nudge{ animation:presentRing 3.6s ease-out infinite; }
.btn-present.nudge::after{
  content:'';position:absolute;top:0;bottom:0;left:-60%;width:45%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);
  transform:skewX(-18deg);pointer-events:none;
  animation:presentSheen 3.6s ease-in-out infinite;
}
.btn-present.nudge:hover,.btn-present.nudge:hover::after{ animation-play-state:paused; }
@keyframes presentRing{
  0%   { box-shadow:0 2px 12px rgba(35,165,120,.22),0 0 0 0 rgba(35,165,120,.55); }
  45%  { box-shadow:0 2px 12px rgba(35,165,120,.22),0 0 0 9px rgba(35,165,120,0); }
  100% { box-shadow:0 2px 12px rgba(35,165,120,.22),0 0 0 9px rgba(35,165,120,0); }
}
@keyframes presentSheen{
  0%,55% { left:-60%; }
  85%,100% { left:120%; }
}
@media (prefers-reduced-motion:reduce){
  .btn-present.nudge,.btn-present.nudge::after{ animation:none; }
}
.btn-present-lbl{
  overflow:hidden;
  transition:max-width .3s ease, opacity .2s;
  max-width:80px;
}
.sidebar.collapsed .btn-present{ flex:none;width:36px;height:36px;padding:0;box-shadow:none; }
.sidebar.collapsed .btn-present-lbl{ display:none; }

.slide-ctr{
  flex-shrink:0;
  font-size:12px;font-weight:700;letter-spacing:.06em;
  color:rgba(255,255,255,.28);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
  transition:opacity .2s;
}
.sidebar.collapsed .slide-ctr{ display:none; }

.btn-dl{
  flex-shrink:0;width:36px;height:36px;border-radius:9px;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.7);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s,border-color .15s;
}
.btn-dl:hover{ background:rgba(255,255,255,.13);color:#fff;border-color:rgba(255,255,255,.2); }
.btn-dl svg{ width:16px;height:16px; }
/* not while presenting, not in the slim rail */
.sidebar.collapsed .btn-dl, body.presenting .btn-dl{ display:none; }

/* ═══════════════════════════════
   DOWNLOAD PAGE  (#download)
═══════════════════════════════ */
.xp{
  position:fixed;inset:0;z-index:100;
  background:#0a1a12;color:#fff;
  display:flex;flex-direction:column;
}
.xp[hidden]{ display:none; }
.xp-hdr{
  flex-shrink:0;display:flex;align-items:center;gap:16px;
  height:56px;padding:0 24px;
  border-bottom:1px solid rgba(255,255,255,.07);background:#0d1f14;
}
.xp-back{
  height:34px;padding:0 12px 0 8px;border-radius:9px;border:none;
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.75);
  font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:background .15s,color .15s;
}
.xp-back:hover{ background:rgba(255,255,255,.13);color:#fff; }
.xp-back svg{ width:16px;height:16px; }
.xp-hdr h1{ font-size:16px;font-weight:700; }

.xp-body{
  flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;
}
.xp-main{ min-height:0;display:flex;flex-direction:column; }
.xp-tools{
  flex-shrink:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:12px 24px;border-bottom:1px solid rgba(255,255,255,.06);
}
.xp-tools-lbl{ font-size:12px;font-weight:600;color:rgba(255,255,255,.38);margin-right:4px;letter-spacing:.02em; }
.xp-chip{
  height:30px;padding:0 12px;border-radius:15px;
  border:1.5px solid rgba(255,255,255,.12);background:transparent;
  color:rgba(255,255,255,.7);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;
}
.xp-chip:hover{ background:rgba(255,255,255,.07);color:#fff; }
.xp-chip:disabled{ opacity:.35;cursor:default;background:transparent; }
.xp-list{ flex:1;overflow-y:auto;padding:16px 24px; }
.xp-cols{ columns:215px 5;column-gap:14px; }
.xp-list::-webkit-scrollbar{ width:6px; }
.xp-list::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12);border-radius:3px; }

.xp-grp{
  background:#0d1f14;border:1px solid rgba(255,255,255,.06);
  border-radius:10px;margin-bottom:14px;overflow:hidden;
  break-inside:avoid;
}
.xp-row{
  display:flex;align-items:center;gap:12px;
  min-height:28px;padding:0 12px;cursor:pointer;user-select:none;
  transition:background .1s;
}
.xp-row:hover{ background:rgba(255,255,255,.04); }
.xp-grp-hdr{ min-height:38px;border-bottom:1px solid rgba(255,255,255,.05);margin-bottom:3px; }
.xp-grp > .xp-row:last-child{ margin-bottom:5px; }
.xp-grp-hdr .xp-ico{ width:14px;height:14px;color:rgba(255,255,255,.45);flex-shrink:0; }
.xp-grp-name{ flex:1;font-size:13px;font-weight:700; }
.xp-grp-count{ font-size:11.5px;font-weight:700;color:rgba(255,255,255,.35);font-variant-numeric:tabular-nums; }
.xp-num{
  width:22px;text-align:right;flex-shrink:0;
  font-size:11px;font-weight:700;color:rgba(255,255,255,.3);font-variant-numeric:tabular-nums;
}
.xp-name{ flex:1;min-width:0;font-size:12.5px;color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.xp-sub{ padding-left:44px; }
.xp-sub .xp-name{ font-size:12px;color:rgba(255,255,255,.6); }
.xp-sub-mark{ width:10px;height:10px;flex-shrink:0;border-left:1.5px solid rgba(242,217,140,.45);border-bottom:1.5px solid rgba(242,217,140,.45);border-radius:0 0 0 3px;margin:-6px 0 0 -4px; }
.xp-tag{
  flex-shrink:0;font-size:10.5px;font-weight:600;letter-spacing:.02em;
  padding:2px 8px;border-radius:10px;
  background:rgba(255,255,255,.06);color:rgba(255,255,255,.45);
}

/* custom checkbox with tri-state */
.xp-cb{ appearance:none;-webkit-appearance:none;flex-shrink:0;margin:0;
  width:16px;height:16px;border-radius:4px;cursor:pointer;
  border:1.5px solid rgba(255,255,255,.3);background:transparent;
  display:grid;place-content:center;transition:background .12s,border-color .12s;
}
.xp-cb:hover{ border-color:rgba(255,255,255,.55); }
.xp-cb:checked,.xp-cb:indeterminate{ background:#23A578;border-color:#23A578; }
.xp-cb::before{ content:'';width:9px;height:9px;transform:scale(0);transition:transform .1s;background:#fff;
  clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%); }
.xp-cb:checked::before{ transform:scale(1); }
.xp-cb:indeterminate::before{ transform:scale(1);clip-path:inset(40% 5% 40% 5% round 2px); }
.xp-cb:focus-visible{ outline:2px solid #a0f0c8;outline-offset:2px; }

/* right column */
.xp-side{
  min-height:0;overflow-y:auto;
  border-left:1px solid rgba(255,255,255,.07);background:#0d1f14;
  padding:24px;display:flex;flex-direction:column;gap:18px;
}
.xp-side > *{ flex-shrink:0; }
.xp-sum{ display:flex;align-items:baseline;gap:8px; }
.xp-sum b{ font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em; }
.xp-sum span{ font-size:13px;color:rgba(255,255,255,.45); }
.xp-field label{ display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.5);margin-bottom:7px; }
.xp-name-wrap{ display:flex;align-items:center;height:40px;border-radius:9px;
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);transition:border-color .15s; }
.xp-name-wrap:focus-within{ border-color:rgba(35,165,120,.6); }
.xp-name-wrap input{ flex:1;min-width:0;height:100%;background:transparent;border:none;outline:none;
  color:#fff;font-family:inherit;font-size:13.5px;padding:0 0 0 12px; }
.xp-name-wrap span{ padding:0 12px 0 2px;font-size:13px;color:rgba(255,255,255,.35); }
.xp-go{
  height:46px;border-radius:10px;border:none;
  background:#23A578;color:#fff;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 4px 18px rgba(35,165,120,.25);transition:background .15s;
}
.xp-go:hover{ background:#1c9c6e; }
.xp-go:disabled{ background:rgba(255,255,255,.1);color:rgba(255,255,255,.35);box-shadow:none;cursor:default; }
.xp-go svg{ width:17px;height:17px; }
.xp-note{ font-size:12px;line-height:1.55;color:rgba(255,255,255,.4); }
.xp-prog{ display:none;flex-direction:column;gap:10px; }
.xp-prog.on{ display:flex; }
.xp-bar{ height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden; }
.xp-bar i{ display:block;height:100%;width:0;background:#23A578;border-radius:3px;transition:width .3s ease; }
.xp-prog-txt{ display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:rgba(255,255,255,.65); }
.xp-prog-txt span:first-child{ min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.xp-cancel{ align-self:flex-start;height:30px;padding:0 12px;border-radius:8px;border:1.5px solid rgba(255,255,255,.14);
  background:transparent;color:rgba(255,255,255,.7);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer; }
.xp-cancel:hover{ background:rgba(255,255,255,.07);color:#fff; }
.xp-msg{ display:none;font-size:13px;line-height:1.5;padding:12px 14px;border-radius:9px; }
.xp-msg.ok{ display:block;background:rgba(35,165,120,.12);color:#a0f0c8; }
.xp-msg.err{ display:block;background:rgba(226,115,90,.12);color:#f2a08c; }
.xp.busy .xp-main{ pointer-events:none;opacity:.55; }
/* capture frame: full size, tucked under the download page so it renders but stays unseen */
.xp-cap{ position:fixed;top:0;left:0;width:1920px;height:1080px;border:0;z-index:50;pointer-events:none; }

@media (max-width:1440px){
  .xp-body{ grid-template-columns:minmax(0,1fr) 290px; }
  .xp-side{ padding:20px; }
}
@media (max-width:900px){
  .xp-body{ grid-template-columns:minmax(0,1fr);overflow-y:auto; }
  .xp-main{ min-height:auto; }
  .xp-list{ overflow:visible; }
  .xp-side{ border-left:none;border-top:1px solid rgba(255,255,255,.07);overflow:visible; }
  .xp-hdr,.xp-tools,.xp-list{ padding-left:16px;padding-right:16px; }
}

═══════════════════════════════ */
.stage-host{
  flex:1;min-width:0;overflow:hidden;
  background:#013a29;
  display:flex;
  position:relative;
  isolation:isolate;
}

.stage-nav{
  position:absolute;bottom:26px;right:30px;

}

.nav-btn{

  color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;

}

.nav-btn:active{ transform:scale(.92); }
.nav-btn svg{ width:20px;height:20px; }
.nav-btn.hidden{ opacity:0;pointer-events:none; }

<script>window.DECKS = {};</script>
<script src="decks/hrone.js"></script>
<script src="decks/studio.js"></script>
<script src="decks/ai-interviewer.js"></script>
<script>
// ── Deck selection ───────────────────────────────────────────────
// Each deck file in /decks registers itself on DECKS. The deck is picked by
// ?deck=<id> (handy for local testing), else by domain, else HROne.
const DECK = (() => {
  const q = new URLSearchParams(location.search).get('deck');
  if (q && DECKS[q]) return DECKS[q];
  const host = location.hostname;
  return Object.values(DECKS).find(d => (d.hosts || []).includes(host)) || DECKS.hrone;
})();
document.title = DECK.pageTitle;
document.querySelector('.hdr-title').textContent = DECK.title;

// ── Manifest ─────────────────────────────────────────────────────
const GROUPS = DECK.groups;

// filename → slide lookup
const SLIDE_DIR = 'slides/';   // all slide files live here
const FILE_MAP = {};
GROUPS.forEach(g => g.slides.forEach(s => { if (s.f) FILE_MAP[s.f] = s; }));
// Themed slides: restore this browser's last light/dark choice, and let either file resolve to the slide.
const themeKey = n => `slide-theme-${n}`;
GROUPS.forEach(g => g.slides.forEach(s => {
  if (!s.themes) return;
  let mode = null;
  try { mode = localStorage.getItem(themeKey(s.n)); } catch(e) {}
  if (mode && s.themes[mode]) s.f = s.themes[mode];
  Object.values(s.themes).forEach(f => { FILE_MAP[f] = s; });
}));
const themeOf = s => Object.keys(s.themes).find(k => s.themes[k] === s.f) || Object.keys(s.themes)[0];
const SUN_SVG  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>`;
const MOON_SVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>`;

// Slides the presenter has hidden from numbering/arrow-nav for this session (not persisted).
const disabledSlides = new Set();

const EYE_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
const CHEV_SVG = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>`;
const EYE_OFF_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a18.5 18.5 0 015.06-5.94M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 7 11 7a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

// ── Build nav DOM ─────────────────────────────────────────────────
const navScroll = document.getElementById('navScroll');
const navEmpty  = document.getElementById('navEmpty');

GROUPS.forEach(g => {
  const el = document.createElement('div');
  el.className = 'nav-grp';
  el.dataset.gid = g.id;

  el.innerHTML =
    `<div class="grp-hdr">
       <span class="grp-icon">
         <svg viewBox="0 0 14 14" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
           <path d="${g.icon}"/>
         </svg>
       </span>
       <span class="grp-label">${g.label}</span>
       <span class="grp-badge">${g.slides.length}</span>
       <svg class="grp-chevron" viewBox="0 0 14 14" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
         <path d="M5 3l4 4-4 4"/>
       </svg>
     </div>
     <div class="grp-slides">
       ${g.slides.map(s =>
         `<div class="slide-row${s.f ? '' : ' stub'}${s.sub ? ' has-sub' : ''}"
               data-n="${s.n}" data-q="${s.t.toLowerCase()}" data-file="${s.f || ''}">
            <span class="slide-num">${String(s.n).padStart(2,'0')}</span>
            <span class="slide-name">${s.html || s.t}</span>
            ${s.sub ? `<button class="sub-toggle" type="button" data-toggle="${s.n}" aria-expanded="false" title="Show the ${s.sub.length} depth slides">${CHEV_SVG}</button>` : ''}
            ${s.themes ? `<button class="theme-switch" type="button" data-mode="${themeOf(s)}" title="Switch cover: light / dark" aria-label="Switch between light and dark cover"><span class="ts-knob">${themeOf(s) === 'dark' ? MOON_SVG : SUN_SVG}</span></button>` : ''}
            ${s.optional ? `<button class="slide-eye" type="button" title="Show/hide this slide when presenting" aria-label="Toggle slide visibility">${EYE_SVG}</button>` : ''}
          </div>` +
         (s.sub ? `<div class="sub-wrap" data-subwrap="${s.n}">` + s.sub.map((sb,i) =>
           `<div class="sub-row" data-n="${s.n}" data-parent="${s.n}" data-sub="${i}"
                 data-q="${sb.t.toLowerCase()}" data-file="${sb.f}" title="${sb.t} — depth ${i+1} of ${s.sub.length}">
              <span class="sub-dot"></span><span class="sub-name">${sb.t}</span>
            </div>`).join('') + `</div>` : '')
       ).join('')}
     </div>`;

  el.querySelector('.grp-hdr').addEventListener('click', () => {
    if (!sidebar.classList.contains('collapsed')) el.classList.toggle('open');
  });

  el.querySelectorAll('.slide-row:not(.stub)').forEach(row => {
    row.addEventListener('click', () => goTo(+row.dataset.n, row.dataset.file));
  });

  el.querySelectorAll('.sub-row').forEach(row => {
    row.addEventListener('click', (e) => {
      e.stopPropagation();
      goDepth(+row.dataset.parent, +row.dataset.sub);
    });
  });

  el.querySelectorAll('.sub-toggle').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setSubOpen(+btn.dataset.toggle, !btn.classList.contains('open'));
    });
  });

  el.querySelectorAll('.theme-switch').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const row = btn.closest('.slide-row');
      const s = GROUPS.flatMap(g => g.slides).find(x => x.n === +row.dataset.n);
      const mode = themeOf(s) === 'dark' ? 'light' : 'dark';
      s.f = s.themes[mode];
      row.dataset.file = s.f;
      btn.dataset.mode = mode;
      btn.querySelector('.ts-knob').innerHTML = mode === 'dark' ? MOON_SVG : SUN_SVG;
      try { localStorage.setItem(themeKey(s.n), mode); } catch(e) {}
      if (current === s.n) goTo(s.n, s.f);   // swap the slide in place if it's showing
    });
  });

  el.querySelectorAll('.slide-eye').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const n = +btn.closest('.slide-row').dataset.n;
      if (disabledSlides.has(n)) disabledSlides.delete(n); else disabledSlides.add(n);
      renumberUI();
    });
  });

  navScroll.insertBefore(el, navEmpty);
});

// ── State ─────────────────────────────────────────────────────────
const sidebar  = document.getElementById('sidebar');
const frame    = document.getElementById('slideFrame');
const slideCtr = document.getElementById('slideCtr');
let   current  = 1;
// -1 = on the spine slide itself; 0..n = index into that slide's depth stack.
let   curSub   = -1;

// depth filename -> { n: parent slide number, i: depth index }
const SUB_MAP = {};
GROUPS.forEach(g => g.slides.forEach(s => {
  if (s.sub) s.sub.forEach((sb, i) => { SUB_MAP[sb.f] = { n: s.n, i }; });
}));

// ── Usage analytics (GA4) ─────────────────────────────────────────
// Who's using the deck: /me (SSO server) gives an opaque hashed id — never the email —
// so GA counts people rather than browsers. Off the SSO server /me 404s and events still go.
const gaReady = fetch('/me', { credentials: 'same-origin' })
  .then(r => r.ok ? r.json() : {})
  .then(u => { if (u.uid) gtag('set', { user_id: u.uid }); })
  .catch(() => {});
function track(name, params) { gaReady.then(() => gtag('event', name, params)); }
// The server drops a one-shot cookie right after a successful Microsoft sign-in.
if (/(^|;\s*)ga_login=1/.test(document.cookie)) {
  document.cookie = 'ga_login=; Max-Age=0; Path=/';
  track('login', { method: 'Microsoft' });
}
// slide number → its sidebar section ("Introduction", "Modules", …)
const SECTION_OF = {};
GROUPS.forEach(g => g.slides.forEach(s => { SECTION_OF[s.n] = g.label; }));
// One page_view + slide_view per slide shown, whether reached from the sidebar, next/prev,
// arrow keys or the slide's own buttons — all of them end in the frame loading a slide.
let lastTracked = null;
function trackSlide(file) {
  const sub = SUB_MAP[file];
  const n = sub ? sub.n : FILE_MAP[file]?.n;
  const s = sub ? subsFor(sub.n)[sub.i] : FILE_MAP[file];
  if (!s) return;
  const key = `${n}:${sub ? sub.i : -1}`;
  if (key === lastTracked) return;   // same slide reloaded in place (light/dark switch) — not a new view
  lastTracked = key;
  track('page_view', {
    page_title: `${DECK.pageTitle} · ${s.t}`,
    page_location: `${location.origin}${location.pathname}?slide=${file.replace(/\.html$/, '')}`,
  });
  // slide_number is the deck's own number for the slide (depth slides carry their parent's),
  // so it stays comparable even when a presenter hides slides and the on-screen count shifts.
  track('slide_view', { slide_number: n, slide_title: s.t, slide_section: SECTION_OF[n] });
}

function setSubOpen(n, open) {
  const btn  = document.querySelector(`.sub-toggle[data-toggle="${n}"]`);
  const wrap = document.querySelector(`.sub-wrap[data-subwrap="${n}"]`);
  if (btn)  btn.classList.toggle('open', open), btn.setAttribute('aria-expanded', String(open));
  if (wrap) wrap.classList.toggle('open', open);
}
function subsFor(n) {
  const s = GROUPS.flatMap(g => g.slides).find(x => x.n === n);
  return (s && s.sub) || null;
}

// All slides with a real file, static manifest order.
function getFullList() {
  return GROUPS.flatMap(g => g.slides.filter(s => s.f)).sort((a,b) => a.n - b.n);
}
// Slides currently switched on (excludes anything the presenter hid via the eye toggle).
function getActiveList() {
  return getFullList().filter(s => !disabledSlides.has(s.n));
}
// 1-based position `n` would occupy among the active slides, whether or not it's active itself.
function displayNumberFor(n) {
  return getActiveList().filter(s => s.n < n).length + 1;
}

function renumberUI() {
  const active = getActiveList();
  const total  = active.length;

  document.querySelectorAll('.slide-row').forEach(r => {
    const n = +r.dataset.n;
    const disabled = disabledSlides.has(n);
    r.classList.toggle('row-disabled', disabled);
    const numEl = r.querySelector('.slide-num');
    if (numEl) numEl.textContent = disabled ? '—' : String(displayNumberFor(n)).padStart(2,'0');
    const eyeBtn = r.querySelector('.slide-eye');
    if (eyeBtn) eyeBtn.innerHTML = disabled ? EYE_OFF_SVG : EYE_SVG;
  });

  document.querySelectorAll('.nav-grp').forEach(g => {
    const grp = GROUPS.find(x => x.id === g.dataset.gid);
    const badge = g.querySelector('.grp-badge');
    if (grp && badge) badge.textContent = grp.slides.filter(s => s.f && !disabledSlides.has(s.n)).length;
  });

  slideCtr.textContent = `${String(displayNumberFor(current)).padStart(2,'0')} / ${total}`;
  syncFrameCounter();
}

function syncFrameCounter() {
  try { frame.contentWindow.postMessage({ type:'set-counter', text: slideCtr.textContent }, '*'); } catch(e) {}
}

function setActive(n) {
  current = n;

  document.querySelectorAll('.slide-row').forEach(r => {
    r.classList.toggle('active', +r.dataset.n === n);
  });

  document.querySelectorAll('.sub-row').forEach(r => {
    r.classList.toggle('active', +r.dataset.parent === n && +r.dataset.sub === curSub);
  });

  // the slide you're on reveals its own depth stack; others stay as you left them
  if (subsFor(n)) setSubOpen(n, true);

  // Auto-open parent group
  document.querySelectorAll('.nav-grp').forEach(g => {
    const has = [...g.querySelectorAll('.slide-row')].some(r => +r.dataset.n === n);
    if (has) g.classList.add('open');
  });

  requestAnimationFrame(() => {
    const row = navScroll.querySelector('.slide-row.active');
    if (row) row.scrollIntoView({ block:'nearest', behavior:'smooth' });
  });

  renumberUI();
}

function goTo(n, file) {
  if (!file) return;
  curSub = -1;
  frame.src = SLIDE_DIR + file;
  setActive(n);
  updateShellNav();
}

// Drop into the i-th depth slide behind spine slide n.
function goDepth(n, i) {
  const subs = subsFor(n);
  if (!subs || !subs[i]) return;
  curSub = i;
  frame.src = SLIDE_DIR + subs[i].f;
  setActive(n);
  updateShellNav();
}

function updateShellNav() {
  btnPrev.style.visibility = 'hidden';
  btnNext.style.visibility = 'hidden';
}

// Sync when slide's own prev/next buttons are used
frame.addEventListener('load', () => {
  try {
    const file = frame.contentWindow.location.href.split('/').pop().split('?')[0];
    const sub = SUB_MAP[file];
    if (sub) { curSub = sub.i; setActive(sub.n); }
    else { const s = FILE_MAP[file]; if (s) { curSub = -1; setActive(s.n); } }
    updateShellNav();
    trackSlide(file);
  } catch(e) {}
  try { frame.contentWindow.dispatchEvent(new Event('resize')); } catch(e) {}
  syncFrameCounter();
});


// ── Toggle ────────────────────────────────────────────────────────
document.getElementById('toggleBtn').addEventListener('click', () => {
  sidebar.classList.toggle('collapsed');
  document.getElementById('toggleBtn').title =
    sidebar.classList.contains('collapsed') ? 'Expand sidebar' : 'Collapse sidebar';
  scheduleResize();
});

function scheduleResize() {
  setTimeout(() => {
    try { frame.contentWindow.dispatchEvent(new Event('resize')); } catch(e) {}
  }, 310);
}

// ── Search ────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  let any = false;

  document.querySelectorAll('.nav-grp').forEach(g => {
    let hit = false;
    g.querySelectorAll('.slide-row, .sub-row').forEach(r => {
      const show = !q || r.dataset.q.includes(q) || r.dataset.n.includes(q);
      r.style.display = show ? '' : 'none';
      if (show) hit = true;
      // a matching depth slide is useless inside a collapsed stack
      if (show && q && r.classList.contains('sub-row')) setSubOpen(+r.dataset.parent, true);
    });
    g.style.display = hit ? '' : 'none';
    if (q && hit) g.classList.add('open');
    if (hit) any = true;
  });

  navEmpty.style.display = (!any && q) ? 'block' : 'none';
});

// ── Present / Fullscreen ──────────────────────────────────────────
let wasCollapsed = false;
document.getElementById('presentBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    wasCollapsed = sidebar.classList.contains('collapsed');
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
});

document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('presenting', !!document.fullscreenElement);
  if (document.fullscreenElement) document.getElementById('presentBtn').classList.remove('nudge');   // reminder done its job
  if (document.fullscreenElement) track('present_start');
  if (document.fullscreenElement) {
    sidebar.classList.add('collapsed');
  } else {
    if (!wasCollapsed) sidebar.classList.remove('collapsed');
  }
  scheduleResize();
});

// ── Keyboard (shell focus) ────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (!xpPage.hidden) return;   // download page owns the keyboard while open
  if ([' ','PageDown','PageUp','ArrowDown','ArrowUp'].indexOf(e.key) > -1) e.preventDefault();
  navArrow(e.key);
});

// ── Keyboard (iframe focus → postMessage) ─────────────────────────
window.addEventListener('message', e => {
  if (e.data && e.data.type === 'nav-key' && xpPage.hidden) navArrow(e.data.key);
});

const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
btnPrev.addEventListener('click', () => navArrow('ArrowLeft'));
btnNext.addEventListener('click', () => navArrow('ArrowRight'));

function updateNavBtns() {
  const built = getActiveList();
  const idx   = built.findIndex(s => s.n === current);
  if (idx === -1) {
    btnPrev.classList.toggle('hidden', !built.some(s => s.n < current));
    btnNext.classList.toggle('hidden', !built.some(s => s.n > current));
    return;
  }
  btnPrev.classList.toggle('hidden', idx <= 0);
  btnNext.classList.toggle('hidden', idx >= built.length - 1);
}

function navArrow(key) {
  const built = getActiveList();
  const idx   = built.findIndex(s => s.n === current);
  const subs  = subsFor(current);
  const spine = built.find(x => x.n === current) || getFullList().find(x => x.n === current);

  // ── VERTICAL AXIS: the depth stack. Keyboard-only, deliberate. ──
  if (key === 'ArrowDown') {
    if (subs && curSub < subs.length - 1) goDepth(current, curSub + 1);
    return;
  }
  if (key === 'ArrowUp' || key === 'Escape') {
    if (curSub === -1) return;
    if (key === 'Escape' || curSub === 0) { if (spine) goTo(spine.n, spine.f); }
    else goDepth(current, curSub - 1);
    return;
  }

  // ── HORIZONTAL AXIS: the spine. Always leaves depth, so a clicker
  //    can never strand the presenter inside a sub-slide. ──
  const fwd = (key === 'ArrowRight' || key === 'PageDown' || key === ' ');
  const bwd = (key === 'ArrowLeft'  || key === 'PageUp');
  if (!fwd && !bwd) return;

  // Previewing a slide the presenter has hidden — jump relative to its manifest position.
  if (idx === -1) {
    if (fwd) { const nxt = built.find(s => s.n > current); if (nxt) goTo(nxt.n, nxt.f); }
    if (bwd) { const prv = [...built].reverse().find(s => s.n < current); if (prv) goTo(prv.n, prv.f); }
    updateNavBtns();
    return;
  }
  if (fwd && idx < built.length - 1) goTo(built[idx+1].n, built[idx+1].f);
  if (bwd && idx > 0)                goTo(built[idx-1].n, built[idx-1].f);
  updateNavBtns();
}

// ── Download as PDF ───────────────────────────────────────────────
// Opens at #download. Every picked slide is rendered at 1920×1080 in a hidden
// frame, captured to an image, and placed full-bleed on a 16:9 PDF page, so the
// file looks exactly like the deck and has nothing editable in it.
const xpPage = document.getElementById('xp');
const XP_LIBS = {
  shot: 'https://cdn.jsdelivr.net/npm/modern-screenshot@4.6.8/dist/index.js',
  pdf:  'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js',
};
const XP_SETTLE_MS = 2800;   // slides stagger their entrances with timers up to ~2.3s; let them land
const XP_PARALLEL = 3;       // slides rendered at once
const XP_SCALE = 1.5;        // capture at 2880×1620: sharp product screenshots at ~200 KB a page (2× only adds weight)

// Exportable items in deck order: a spine slide, then its depth slides.
// key: "n" for a spine slide, "n.i" for depth slide i behind it.
// A slide marked noExport in its deck file (and its depth slides) is left out.
function xpItems() {
  return GROUPS.flatMap(g => g.slides.filter(s => s.f && !s.noExport).flatMap(s => [
    { key: `${s.n}`, gid: g.id, n: s.n, t: s.t, f: s.f, depth: false },
    ...(s.sub || []).map((sb, i) => ({ key: `${s.n}.${i}`, gid: g.id, n: s.n, t: sb.t, f: sb.f, depth: true })),
  ]));
}
const xpPicked = new Set();
let xpBusy = false, xpCancelled = false;

function xpPick(mode) {
  xpPicked.clear();
  xpItems().forEach(it => {
    if (mode === 'all' ||
        (mode === 'main' && !it.depth)) xpPicked.add(it.key);
  });
  xpSync();
}

function xpRender() {
  const items = xpItems();
  const list = document.getElementById('xpList');
  list.innerHTML = '<div class="xp-cols">' + GROUPS.map(g => {
    const gi = items.filter(it => it.gid === g.id);
    if (!gi.length) return '';
    return `<div class="xp-grp" data-gid="${g.id}">
      <label class="xp-row xp-grp-hdr">
        <input class="xp-cb" type="checkbox" data-grp="${g.id}" aria-label="Select all in ${g.label}">
        <svg class="xp-ico" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${g.icon}"/></svg>
        <span class="xp-grp-name">${g.label}</span>
        <span class="xp-grp-count" data-count="${g.id}"></span>
      </label>
      ${gi.map(it => `<label class="xp-row${it.depth ? ' xp-sub' : ''}" data-key="${it.key}" title="${it.t}">
        <input class="xp-cb" type="checkbox" data-key="${it.key}">
        ${it.depth ? '<span class="xp-sub-mark"></span>' : `<span class="xp-num">${disabledSlides.has(it.n) ? '—' : String(displayNumberFor(it.n)).padStart(2,'0')}</span>`}
        <span class="xp-name">${it.t}</span>
        ${!it.depth && disabledSlides.has(it.n) ? '<span class="xp-tag">Hidden</span>' : ''}
      </label>`).join('')}
    </div>`;
  }).join('') + '</div>';
}

// Reflect xpPicked in checkboxes, group tri-states, counts and the button.
function xpSync() {
  const items = xpItems();
  document.querySelectorAll('#xpList input[data-key]').forEach(cb => { cb.checked = xpPicked.has(cb.dataset.key); });
  GROUPS.forEach(g => {
    const gi = items.filter(it => it.gid === g.id);
    const on = gi.filter(it => xpPicked.has(it.key)).length;
    const cb = document.querySelector(`#xpList input[data-grp="${g.id}"]`);
    if (cb) { cb.checked = on === gi.length && on > 0; cb.indeterminate = on > 0 && on < gi.length; }
    const c = document.querySelector(`#xpList [data-count="${g.id}"]`);
    if (c) c.textContent = `${on} of ${gi.length}`;
  });
  const n = xpPicked.size;
  document.getElementById('xpCount').textContent = n;
  document.getElementById('xpCountOf').textContent = `of ${items.length} slides selected`;
  document.getElementById('xpGoLbl').textContent = n ? `Download ${n} slide${n === 1 ? '' : 's'}` : 'Pick at least one slide';
  document.getElementById('xpGo').disabled = !n || xpBusy;
}

document.getElementById('xpList').addEventListener('change', e => {
  const cb = e.target;
  const items = xpItems();
  if (cb.dataset.grp) {
    items.filter(it => it.gid === cb.dataset.grp).forEach(it => cb.checked ? xpPicked.add(it.key) : xpPicked.delete(it.key));
  } else if (cb.dataset.key) {
    const it = items.find(x => x.key === cb.dataset.key);
    // a spine slide carries its depth slides with it; depth slides can still be unticked one by one
    const keys = it.depth ? [it.key] : items.filter(x => x.n === it.n).map(x => x.key);
    keys.forEach(k => cb.checked ? xpPicked.add(k) : xpPicked.delete(k));
  }
  xpSync();
});
document.querySelectorAll('.xp-chip[data-pick]').forEach(b => b.addEventListener('click', () => xpPick(b.dataset.pick)));


// ── Open / close (#download, so browser Back closes it too) ──
function xpOpen() {
  if (!xpPage.hidden) return;
  xpRender();
  xpPick('all');
  const d = new Date().toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  document.getElementById('xpName').value = `${DECK.pageTitle} - ${d}`;
  document.getElementById('xpMsg').className = 'xp-msg';
  xpPage.hidden = false;
  document.getElementById('xpBack').focus();
  xpLoadLibs().catch(() => {});   // warm up while they pick
}
function xpClose() {
  if (xpPage.hidden) return;
  if (xpBusy && !confirm('Stop the download in progress?')) { history.pushState({ xp: 1 }, '', '#download'); return; }
  xpCancelled = true;
  xpPage.hidden = true;
  document.getElementById('presentBtn').focus();
}
function xpRoute() { location.hash === '#download' ? xpOpen() : xpClose(); }
addEventListener('hashchange', xpRoute);
addEventListener('popstate', xpRoute);
document.getElementById('downloadBtn').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  history.pushState({ xp: 1 }, '', '#download');
  xpOpen();
});
document.getElementById('xpBack').addEventListener('click', () => {
  if (history.state && history.state.xp) return history.back();   // popstate → xpRoute closes it
  history.replaceState(null, '', location.pathname + location.search);   // landed straight on #download
  xpClose();
});
xpPage.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('xpBack').click(); });

// ── Capture ──
let xpLibsP = null, xpShotSrc = '';
function xpLoadLibs() {
  return xpLibsP ||= (async () => {
    const shot = fetch(XP_LIBS.shot).then(r => { if (!r.ok) throw new Error('screenshot library'); return r.text(); });
    if (!window.jspdf) await new Promise((ok, fail) => {
      const s = document.createElement('script');
      s.src = XP_LIBS.pdf; s.onload = ok; s.onerror = () => fail(new Error('PDF library'));
      document.head.appendChild(s);
    });
    xpShotSrc = await shot;
  })().catch(e => { xpLibsP = null; throw e; });
}

const xpWait = ms => new Promise(r => setTimeout(r, ms));
// Let layout settle. Browsers stop drawing frames in a background tab, so never wait on a
// frame alone: whichever comes first, two frames or a short timer, lets the export carry on.
const xpNextFrame = () => Promise.race([
  new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))),
  xpWait(120),
]);
const xpFrameLoaded = f => new Promise(ok => {
  if (f.contentDocument && f.contentDocument.readyState === 'complete' && f.contentWindow.location.href !== 'about:blank') return ok();
  f.addEventListener('load', ok, { once: true });
  setTimeout(ok, 10000);
});

// Get a document ready for its picture: fonts in, media decoded, entrances finished.
async function xpSettle(doc) {
  const win = doc.defaultView;
  if (!win.modernScreenshot) { const s = doc.createElement('script'); s.textContent = xpShotSrc; doc.head.appendChild(s); }
  await Promise.race([doc.fonts.ready, xpWait(4000)]);
  await Promise.all([...doc.images].map(img => img.complete ? 0 : new Promise(r => { img.onload = img.onerror = r; setTimeout(r, 5000); })));
  for (const f of doc.querySelectorAll('iframe')) { await xpFrameLoaded(f); try { await xpSettle(f.contentDocument); } catch(e) {} }
}
function xpFinishAnimations(doc) {
  doc.getAnimations().forEach(a => {
    const t = a.effect && a.effect.getComputedTiming();
    if (t && isFinite(t.endTime)) { try { a.finish(); } catch(e) {} }
  });
  doc.querySelectorAll('iframe').forEach(f => { try { xpFinishAnimations(f.contentDocument); } catch(e) {} });
}
// The screenshot library pins each element's measured width, and its text can come out a hair
// wider, so a line that just fits would wrap. Every text block that doesn't wrap on screen (its
// only line breaks are <br>s) is locked to nowrap; everything else keeps its own setting.
function xpLockLines(doc) {
  const win = doc.defaultView, range = doc.createRange();
  const els = [...doc.body.querySelectorAll('*')];
  const ws = new Map(els.map(el => [el, win.getComputedStyle(el).whiteSpace]));
  const softWraps = el => {   // walks el's text, stepping into inline children only
    let last = null, any = false;
    const walk = node => {
      for (const n of node.childNodes) {
        if (n.nodeType === 3) {
          if (!n.textContent.trim()) continue;
          any = true;
          range.selectNodeContents(n);
          for (const r of range.getClientRects()) {
            if (!r.width) continue;
            if (last && r.top >= last.bottom - 1) return true;
            last = r;
          }
        } else if (n.nodeType === 1) {
          if (n.tagName === 'BR') { last = null; continue; }
          if (win.getComputedStyle(n).display === 'inline' && walk(n)) return true;
        }
      }
      return false;
    };
    return walk(el) || !any;
  };
  for (const el of els) {
    const w = ws.get(el);
    const lock = win.getComputedStyle(el).display !== 'inline' && (w === 'normal' || w === 'pre-line') && !softWraps(el);
    el.style.whiteSpace = lock ? 'nowrap' : w;   // pin every element, so a lock never leaks into children
  }
}
// The library copies SVG attributes but drops style values that look like defaults, so an inline
// style overriding an attribute (opacity="0" faded in by script) loses. Write the live value back.
function xpSyncSvgAttrs(doc) {
  const win = doc.defaultView;
  doc.querySelectorAll('svg *').forEach(el => {
    for (const a of ['opacity', 'fill-opacity', 'stroke-opacity', 'visibility', 'display']) {
      if (el.hasAttribute(a)) el.setAttribute(a, win.getComputedStyle(el).getPropertyValue(a));
    }
  });
}
// Swap every <video> for its poster image before capture. Hidden tabs never load video, and the
// screenshot library would wait on it forever; the poster gives the same picture either way.
async function xpFlattenVideos(doc) {
  const win = doc.defaultView;
  for (const v of [...doc.querySelectorAll('video')]) {
    const img = doc.createElement('img');
    const cs = win.getComputedStyle(v);
    for (const p of cs) img.style.setProperty(p, cs.getPropertyValue(p));
    if (v.poster) { img.src = v.poster; await img.decode().catch(() => {}); }
    else img.style.visibility = 'hidden';
    v.replaceWith(img);
  }
}
// The screenshot library can't see inside iframes, so swap each one for a picture of itself, innermost first.
async function xpFlattenFrames(doc) {
  for (const f of [...doc.querySelectorAll('iframe')]) {
    const fd = f.contentDocument, fw = f.contentWindow;
    if (!fd || !fw.modernScreenshot) continue;
    await xpFlattenFrames(fd);
    await xpFlattenVideos(fd);
    const url = await fw.modernScreenshot.domToPng(fd.documentElement, { width: fw.innerWidth, height: fw.innerHeight, scale: XP_SCALE });
    const img = doc.createElement('img');
    const cs = doc.defaultView.getComputedStyle(f);
    for (const p of cs) img.style.setProperty(p, cs.getPropertyValue(p));
    img.src = url;
    await img.decode().catch(() => {});
    f.replaceWith(img);
  }
}

async function xpCaptureSlide(file) {
  const f = document.createElement('iframe');
  f.className = 'xp-cap';
  f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
  f.src = SLIDE_DIR + file;
  document.body.appendChild(f);
  try {
    await xpFrameLoaded(f);
    const doc = f.contentDocument;
    await xpSettle(doc);
    await xpWait(XP_SETTLE_MS);
    xpFinishAnimations(doc);
    doc.querySelectorAll('.nav').forEach(n => n.style.display = 'none');   // the slide's own prev/next pill
    await xpNextFrame();
    await xpFlattenFrames(doc);
    await xpFlattenVideos(doc);
    xpLockLines(doc);
    xpSyncSvgAttrs(doc);
    const stage = doc.getElementById('stage') || doc.body;
    // scale(1), not 'none': slide.css hides any #stage whose style has no "scale" (the pre-fit guard)
    stage.style.transform = 'scale(1)';
    return await f.contentWindow.modernScreenshot.domToJpeg(stage, { width: 1920, height: 1080, scale: XP_SCALE, quality: .72 });
  } finally { f.remove(); }
}

function xpProgress(done, total, label) {
  document.getElementById('xpBar').style.width = `${Math.round(done / total * 100)}%`;
  document.getElementById('xpProgTxt').textContent = label;
  document.getElementById('xpProgNum').textContent = `${done} / ${total}`;
}
function xpMessage(kind, text) {
  const m = document.getElementById('xpMsg');
  m.className = `xp-msg ${kind}`; m.textContent = text;
}

document.getElementById('xpCancel').addEventListener('click', () => { xpCancelled = true; });
document.getElementById('xpGo').addEventListener('click', async () => {
  const items = xpItems().filter(it => xpPicked.has(it.key));
  if (!items.length || xpBusy) return;
  const name = (document.getElementById('xpName').value.trim() || DECK.pageTitle).replace(/[\\/:*?"<>|]+/g, '-');

  xpBusy = true; xpCancelled = false;
  xpPage.classList.add('busy');
  document.getElementById('xpProg').classList.add('on');
  document.getElementById('xpMsg').className = 'xp-msg';
  xpSync();
  try {
    xpProgress(0, items.length, 'Getting ready…');
    await xpLoadLibs();
    // Capture a few at a time; slides are added afterwards so the order never changes.
    const imgs = new Array(items.length);
    let next = 0, done = 0;
    await Promise.all(Array.from({ length: Math.min(XP_PARALLEL, items.length) }, async () => {
      while (next < items.length) {
        if (xpCancelled) throw 'cancelled';
        const i = next++;
        xpProgress(done, items.length, `Capturing “${items[i].t}”`);
        imgs[i] = await xpCaptureSlide(items[i].f);
        xpProgress(++done, items.length, `Captured “${items[i].t}”`);
      }
    }));
    if (xpCancelled) throw 'cancelled';
    xpProgress(items.length, items.length, 'Building the PDF…');
    // One 16:9 page per slide (1440 × 810 pt), with a bookmark per slide title.
    const W = 1440, H = 810;
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: [W, H], compress: true });
    pdf.setProperties({ title: name, author: 'HROne', creator: 'HROne Deck' });
    items.forEach((it, i) => {
      if (i) pdf.addPage([W, H], 'landscape');
      pdf.addImage(imgs[i], 'JPEG', 0, 0, W, H, undefined, 'FAST');
      pdf.outline.add(null, it.t, { pageNumber: i + 1 });
    });
    pdf.save(`${name}.pdf`);
    track('deck_download', { file_type: 'pdf', slide_count: items.length });   // not the typed file name — may hold a client's name
    xpMessage('ok', `Downloaded “${name}.pdf” with ${items.length} slide${items.length === 1 ? '' : 's'}.`);
  } catch (e) {
    if (e === 'cancelled') xpMessage('err', 'Download cancelled.');
    else { console.error('[download]', e); xpMessage('err', `Couldn't build the file${e && e.message ? ` (${e.message})` : ''}. Check your connection and try again.`); }
  } finally {
    xpBusy = false;
    xpPage.classList.remove('busy');
    document.getElementById('xpProg').classList.remove('on');
    document.querySelectorAll('.xp-cap').forEach(f => f.remove());
    xpSync();
  }
});

// Open the deck on its first slide
{ const first = getFullList()[0]; goTo(first.n, first.f); }
updateNavBtns();
xpRoute();
</script>
</body>
</html>
