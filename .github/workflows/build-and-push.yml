name: Build & push to ACR

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'Assets/**'
      - '**/*.html'
      - '.dockerignore'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

env:
  IMAGE_REPO: sales/hrone-pitch-deck

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          # Secrets baked into the image at build time (kept out of git source).
          build-args: |
            CLIENT_SECRET=${{ secrets.APP_CLIENT_SECRET }}
            SESSION_SECRET=${{ secrets.APP_SESSION_SECRET }}
          # Version defaults to 1.0.0 on push; override via "Run workflow" input.
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:${{ github.event.inputs.version || '1.0.0' }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:latest
